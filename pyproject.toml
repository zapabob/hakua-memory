[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hakua-memory"
version = "0.1.0"
description = "Composite memory library: Ebbinghaus + Semantic Graph + Obsidian Wiki"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
authors = [{name = "Hakua"}]
dependencies = [
  "sqlalchemy>=2,<3",
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
obsidian = ["gitpython>=3,<4"]
embedding = ["llama-cpp-python>=0.3,<1"]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
